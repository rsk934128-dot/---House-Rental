<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#047857" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Circle / Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#primaryGrad)" filter="url(#shadow)" />
  
  <!-- Outer subtle ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />

  <!-- House Silhouette & Structure -->
  <g fill="#ffffff">
    <!-- Chimney -->
    <rect x="316" y="140" width="34" height="54" rx="4" />
    
    <!-- Roof Main -->
    <path d="M256 120 L136 226 C130 231 138 242 146 242 H164 V356 C164 366 172 374 182 374 H330 C340 374 348 366 348 356 V242 H366 C374 242 382 231 376 226 Z" />
  </g>

  <!-- Windows inside roof / attic -->
  <g fill="#047857">
    <rect x="204" y="210" width="28" height="28" rx="6" />
    <rect x="242" y="210" width="28" height="28" rx="6" />
    <rect x="280" y="210" width="28" height="28" rx="6" />
  </g>

  <!-- Door / Keyhole / Location Pin emblem -->
  <g transform="translate(256, 305)">
    <!-- Shield / Location Badge Base -->
    <path d="M-44 -20 C-44 -44 44 -44 44 -20 C44 14 0 52 0 52 C0 52 -44 14 -44 -20 Z" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="6" />
    <!-- Keyhole -->
    <circle cx="0" cy="-12" r="10" fill="#ffffff" />
    <path d="M-5 -12 L5 -12 L7 12 C7 14 5 16 0 16 C-5 16 -7 14 -5 12 Z" fill="#ffffff" />
  </g>

  <!-- Mini Sparkle Accents -->
  <path d="M386 120 Q394 134 408 142 Q394 150 386 164 Q378 150 364 142 Q378 134 386 120 Z" fill="#facc15" />
</svg>
